name: Daily video trigger

on:
  schedule:
    # 10:12 UTC = 15:42 IST - shortly after the scheduled slot
    - cron: '12 10 * * *'
    # 14:42 UTC = 20:12 IST - safety net if the service was asleep
    - cron: '42 14 * * *'
  workflow_dispatch:
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the service and run whatever is due
        run: |
          curl -fsS -X POST "${{ secrets.APP_URL }}/cron?token=${{ secrets.API_TOKEN }}" \
            || echo "trigger failed (the service retries on its own next tick)"